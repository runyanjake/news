# Serves the pre-rendered static site; proxies read-only API calls to the backend.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:10m max_size=100m inactive=1d;

server {
    listen 80;
    server_name _;
    root /srv/site;

    gzip on;
    gzip_types text/css application/json;
    etag on;

    # Pages are replaced in place (atomic rename) whenever a report is generated, so
    # nginx must not hold open file handles (open_file_cache would keep serving the
    # old file) and browsers must revalidate. Revalidation is a cheap ETag 304.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Newest generation of each date; replaced when that date is regenerated.
    location /reports/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Every generation ever rendered; /archive/<date>/<stamp>/ never changes unless
    # the format is rebuilt. The archive index changes on every generation.
    location = /archive/ {
        try_files /archive/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location /archive/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Generation is internal-only (the renderer talks to the backend directly).
    location = /api/reports/generate { return 403; }

    location /api/ {
        limit_except GET { deny all; }
        # Resolve per request via Docker DNS so a recreated backend container (new IP) is picked up.
        resolver 127.0.0.11 valid=10s;
        set $backend http://pws-news-backend:8000;
        proxy_pass $backend;
        proxy_cache api;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
