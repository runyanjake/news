# Serves the pre-rendered static site; proxies read-only API calls to the backend.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:10m max_size=100m inactive=1d;

server {
    listen 80;
    server_name _;
    root /srv/site;

    gzip on;
    gzip_types text/css application/json;
    open_file_cache max=1000 inactive=1h;
    open_file_cache_valid 10m;
    etag on;

    # Front page: replaced once a day at render time. Browsers/CDNs may serve a
    # cached copy briefly and revalidate cheaply via ETag.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400";
    }

    # Historical renderings never change unless the format is rebuilt.
    location /reports/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location /archive/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=600";
    }

    # Generation is internal-only (the renderer talks to the backend directly).
    location = /api/reports/generate { return 403; }

    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://backend:8000;
        proxy_cache api;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
