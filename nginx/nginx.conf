# Serves the pre-rendered static site; proxies read-only API calls to the backend.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:10m max_size=100m inactive=1d;
limit_req_zone $binary_remote_addr zone=visits:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /srv/site;

    gzip on;
    gzip_types text/css application/json;
    etag on;

    # Traefik (on a Docker network) forwards the client in X-Forwarded-For; take the rightmost untrusted address,
    # so a client can't pick its own IP by sending the header. $remote_addr is the real client below.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Pages are swapped by atomic rename: no open_file_cache (it serves the old file); clients revalidate via ETag.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Newest generation of each date; replaced when that date is regenerated.
    location /reports/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # The archive index changes every generation; /archive/<date>/<stamp>/ only on a format rebuild.
    location = /archive/ {
        try_files /archive/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location /archive/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Fonts and their licenses; rewritten with the same bytes on every publish.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Generation and its job status are internal-only (the renderer talks to the backend directly).
    location = /api/reports/generate { return 403; }
    location /api/jobs/ { return 403; }

    # Visit beacon from every page: the only POST that reaches the backend; never cached. The backend counts each
    # visitor once a day; the rate limit just keeps floods off it.
    location = /api/visits {
        limit_except POST { deny all; }
        limit_req zone=visits burst=20 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s;
        set $backend http://pws-news-backend:8000;
        proxy_pass $backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # No purge on a new generation: mutable responses (/api/reports, latest, today's date) lag by up to
    # proxy_cache_valid. The lock and background update keep the backend at ~one request per URL per TTL.
    location /api/ {
        limit_except GET { deny all; }
        # Resolve per request via Docker DNS so a recreated backend container (new IP) is picked up.
        resolver 127.0.0.11 valid=10s;
        set $backend http://pws-news-backend:8000;
        proxy_pass $backend;
        proxy_cache api;
        # The API takes no query args; keying on them would let ?<random> bypass the cache.
        proxy_cache_key $uri;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 400 404 1m;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # A generation stamp's JSON never changes once written.
    location ~ ^/api/reports/[^/]+/generations/[^/]+$ {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s;
        set $backend http://pws-news-backend:8000;
        proxy_pass $backend;
        proxy_cache api;
        proxy_cache_key $uri;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 400 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
