networks:
  news:
    name: news
    driver: bridge
    internal: true
  ai:
    external: true
  traefik:
    external: true

services:
  backend:
    container_name: pws-news-backend
    image: pws-news-backend
    build:
      context: .
      target: backend
    env_file: .env
    environment:
      REPORTS_DIR: /data/reports
    volumes:
      - reports:/data/reports
    networks:
      - news
      - ai
    labels:
      - traefik.enable=false
    restart: unless-stopped

  renderer:
    container_name: pws-news-renderer
    image: pws-news-renderer
    build:
      context: .
      target: renderer
    env_file: .env
    environment:
      BACKEND_URL: http://pws-news-backend:8000
      SITE_DIR: /srv/site
    volumes:
      - site:/srv/site
    networks:
      - news
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    container_name: pws-news-nginx
    image: pws-news-nginx
    build:
      context: .
      target: nginx
    volumes:
      - site:/srv/site:ro
    networks:
      - news
      - traefik
    labels:
      - traefik.docker.network=traefik
      - traefik.http.routers.pws-news.rule=Host(`${NEWS_HOST}`)
      - traefik.http.routers.pws-news.tls=true
      - traefik.http.routers.pws-news.tls.certresolver=lets-encrypt
      - traefik.http.services.pws-news.loadbalancer.server.port=80
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  reports:
  site:
