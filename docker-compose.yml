# No host bind mounts: CI runs compose from inside the Jenkins container against the host's docker daemon,
# where workspace paths don't exist. Config is baked into the images (rebuild after editing it) and
# report history lives in named volumes, which survive `docker compose down` (but not `down -v`).
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      REPORTS_DIR: /data/reports
    volumes:
      - reports:/data/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach an LLM server running on the host
    restart: unless-stopped

  renderer:
    build: ./frontend
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
      SITE_DIR: /srv/site
    volumes:
      - site:/srv/site
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - site:/srv/site:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  reports:
  site:
