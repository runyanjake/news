services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      SOURCES_FILE: /app/config/sources.yaml
      REPORTS_DIR: /data/reports
    volumes:
      - ./config:/app/config:ro
      - ./data/reports:/data/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach an LLM server running on the host
    restart: unless-stopped

  renderer:
    build: ./frontend
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
      SITE_DIR: /srv/site
    volumes:
      - ./data/site:/srv/site
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/site:/srv/site:ro
    depends_on:
      - backend
    restart: unless-stopped
