networks:
  traefik:
    external: true

services:
  pws-news:
    container_name: pws-news
    build:
      context: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.pws-news.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.pws-news.tls=true
      - traefik.http.routers.pws-news.tls.certresolver=lets-encrypt
      - traefik.http.services.pws-news.loadbalancer.server.port=80
