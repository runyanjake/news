pipeline:
  max_age_hours: 36          # ignore items older than this
  max_items_per_source: 30

grouping:
  method: keywords           # "keywords" (rules + title similarity) or "llm" (falls back to keywords)
  similarity_threshold: 0.25
  # Keep rules story-sized, e.g. {name: Ukraine War, keywords: [ukraine, kyiv]}; broad ones merge unrelated stories.
  topics: []

scoring:
  weights:
    reputation: 0.5
    recency: 0.3
    relevance: 0.2
  recency_half_life_hours: 12

report:
  max_entries: 15            # topics that make it into the report
  sources_per_entry: 5       # top N sources fed to the LLM and listed per entry
  min_sources_per_entry: 1
  max_entries_per_tag: 4     # per section (top source's first tag); omit for no cap
