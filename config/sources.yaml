# Sources and pipeline tuning. `type` names a connector in backend/app/connectors/; "${NAME}" values come from .env.

sources:
  - id: guardian-world
    name: The Guardian World
    type: rss
    url: https://www.theguardian.com/world/rss
    reputation: 0.85         # 0.0–1.0 editorial weight used in scoring
  - id: aljazeera
    name: Al Jazeera
    type: rss
    url: https://www.aljazeera.com/xml/rss/all.xml
    reputation: 0.8
  - id: bbc-world
    name: BBC World
    type: rss
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    reputation: 0.85
  - id: npr-news
    name: NPR News
    type: rss
    url: https://feeds.npr.org/1001/rss.xml
    reputation: 0.8
  - id: hn-front
    name: Hacker News
    type: rss
    url: https://hnrss.org/frontpage
    reputation: 0.6
  - id: ars-technica
    name: Ars Technica
    type: rss
    url: https://feeds.arstechnica.com/arstechnica/index
    reputation: 0.75

pipeline:
  max_age_hours: 36          # ignore items older than this
  max_items_per_source: 30

grouping:
  method: keywords           # "keywords" (rules + title similarity) or "llm" (falls back to keywords)
  similarity_threshold: 0.25
  # Keep rules story-sized, e.g. {name: Ukraine War, keywords: [ukraine, kyiv]}; broad ones merge unrelated stories.
  topics: []

scoring:
  weights:
    reputation: 0.5
    recency: 0.3
    relevance: 0.2
  recency_half_life_hours: 12

report:
  max_entries: 15            # topics that make it into the report
  sources_per_entry: 5       # top N sources fed to the LLM and listed per entry
  min_sources_per_entry: 1
