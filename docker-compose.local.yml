# Local runs without Traefik: publish nginx on a host port.
# docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  backend:
    extra_hosts:
      - "host.docker.internal:host-gateway"  # LLM on this machine: LLM_BASE_URL=http://host.docker.internal:<port>/v1
  nginx:
    ports:
      - "${HTTP_PORT:-8080}:80"
